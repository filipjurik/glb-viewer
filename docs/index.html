  #clock { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

  });

  const LAT = 48.15, LON = 17.11, TZ = "Europe/Bratislava";

  // simplified solar position (azimuth: degrees clockwise from north, elevation: degrees above the horizon)
  function sunPosition(date) {
    const rad = Math.PI / 180;
    const d = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
    const g = (357.529 + 0.98560028 * d) % 360;
    const q = (280.459 + 0.98564736 * d) % 360;
    const L = q + 1.915 * Math.sin(g * rad) + 0.02 * Math.sin(2 * g * rad);
    const e = 23.439 - 0.00000036 * d;
    const ra = Math.atan2(Math.cos(e * rad) * Math.sin(L * rad), Math.cos(L * rad)) / rad;
    const dec = Math.asin(Math.sin(e * rad) * Math.sin(L * rad)) / rad;
    const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
    const lst = (gmst * 15 + LON) * rad;
    const H = lst - ra * rad;
    const el = Math.asin(Math.sin(LAT * rad) * Math.sin(dec * rad) + Math.cos(LAT * rad) * Math.cos(dec * rad) * Math.cos(H));
    const az = Math.atan2(-Math.sin(H), Math.tan(dec * rad) * Math.cos(LAT * rad) - Math.sin(LAT * rad) * Math.cos(H));
    return { azimuth: (az / rad + 360) % 360, elevation: el / rad };
  }

  // minutes after midnight in Europe/Bratislava -> Date
  function dateAt(minutes) {
    const fmt = (t) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(t);
    const [y, m, dd] = fmt(new Date()).split("-").map(Number);
    let t = Date.UTC(y, m - 1, dd, 0, minutes);
    const local = new Date(new Date(t).toLocaleString("en-US", { timeZone: TZ }));
    t -= local.getTime() - new Date(new Date(t).toLocaleString("en-US", { timeZone: "UTC" })).getTime();
    return new Date(t);
  }

  function nowMinutes() {
    const p = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date()).split(":");
    return Number(p[0]) * 60 + Number(p[1]);
  }

  // entities used by the lights (colors for the ones whose window glows in the entity color)
  const COLORS = {
    "light.obyvacka_ikea_tradfri": [255, 190, 110], "light.loxone_led_obyvacka": [255, 190, 110],
    "light.lidl_rgb_viki": [120, 160, 255],
    "light.spalna_ikea_tradfri": [255, 150, 80], "light.gu10_betka": [255, 150, 80], "light.gu10_filip": [255, 150, 80],
  };
  const entities = new Set();
  for (const l of CONFIG.lights || []) {
    if (l.entity) entities.add(l.entity);
    (l.entities || []).forEach((e) => entities.add(e));
  }

  const card = document.createElement("dom-viewer-card");
  document.getElementById("stage").appendChild(card);
  card.setConfig(CONFIG);

  const timeEl = document.getElementById("time");
  const clockEl = document.getElementById("clock");
  const lightsEl = document.getElementById("lights");

  function update() {
    const minutes = Number(timeEl.value);
    clockEl.textContent = String(Math.floor(minutes / 60)).padStart(2, "0") + ":" + String(minutes % 60).padStart(2, "0");
    const sp = sunPosition(dateAt(minutes));
    const states = { "sun.sun": { state: sp.elevation > 0 ? "above_horizon" : "below_horizon", attributes: sp } };
    for (const e of entities) {
      const rgb = COLORS[e];
      states[e] = { state: lightsEl.checked ? "on" : "off", attributes: lightsEl.checked ? { brightness: 255, ...(rgb ? { rgb_color: rgb } : {}) } : {} };
    }
    card.hass = { states, themes: {}, language: "en", callService() {} };
  }

  timeEl.addEventListener("input", update);
  lightsEl.addEventListener("change", update);
  document.getElementById("now").addEventListener("click", () => { timeEl.value = nowMinutes(); update(); });
  timeEl.value = nowMinutes();
  update();
